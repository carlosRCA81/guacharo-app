<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRCA PRO V2 - CEREBRO FIJO</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos base para garantizar que nada se mueva en el móvil */
        .panel-arrastre-carlos {
            background: linear-gradient(145deg, #0f172a, #1e293b);
            border: 1px solid #fbbf24;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .arrastre-titulo {
            color: #fbbf24;
            font-size: 0.75rem;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
        }
        .mapa-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            padding: 10px;
        }
        .sector-block {
            background: #1e293b;
            border-radius: 8px;
            padding: 8px;
            border: 1px solid #334155;
        }
        .sector-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        .mini-animal {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: bold;
            border-radius: 3px;
        }
        .sensor-fijo { background: #22c55e !important; color: #000 !important; border: 1px solid #fff; }
        .rojo { background: #ef444433; border: 1px solid #ef4444; color: #fff; }
        .azul { background: #38bdf833; border: 1px solid #38bdf8; color: #fff; }
        .negro { background: #1e293b; border: 1px solid #475569; color: #fff; }

        /* Estilos de las Tripletas Inamovibles */
        .tripleta-list { display: flex; flex-direction: column; gap: 15px; padding: 15px; }
        .tripleta-card {
            background: linear-gradient(145deg, #1e293b, #020617);
            border: 2px solid #fbbf24;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            position: relative;
        }
        .nums-tripleta {
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }
        .num-circle {
            background: rgba(255,255,255,0.05);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid #fbbf24;
        }
        .badge-tripleta { background: #fbbf24; color: #000; padding: 2px 10px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
    </style>
</head>
<body>
    <div id="main-app">
        <header>
            <h1>CRCA PRO <span style="color: #22c55e;">V2</span></h1>
            <div id="live-clock">00:00:00</div>
            <div class="tab-container">
                <button class="tab-btn active" onclick="openTab(event, 'registro')">REGISTRO</button>
                <button class="tab-btn" onclick="openTab(event, 'sectores-tab')">SECTORES</button>
                <button class="tab-btn" onclick="openTab(event, 'tripletas-tab')">TRIPLETAS</button>
                <button class="tab-btn" onclick="openTab(event, 'historial')">HISTORIAL</button>
            </div>
        </header>

        <section id="registro" class="tab-content active">
            <div class="panel-sniper">
                <span class="sniper-badge">🎯 SNIPER</span>
                <div class="sniper-nums" id="numeros-sugeridos-directos">...</div>
            </div>
            <div class="panel-arrastre-carlos">
                <div class="arrastre-titulo">🚨 VIGILANTE</div>
                <div id="contenedor-vigilancia"></div>
            </div>
            <div class="panel-diario" id="panel-diario-sorteos"></div>
            <div class="entrada-rapida">
                <input type="text" id="num-rapido" maxlength="2" placeholder="NRO">
                <button onclick="registrarPorNumero()">ANOTAR</button>
            </div>
            <div class="grid-animales" id="grid-container"></div>
            <input type="date" id="fecha-analisis" class="fecha-input">
        </section>

        <section id="sectores-tab" class="tab-content" style="display:none;">
            <div id="mapa-ruleta" class="mapa-container"></div>
        </section>

        <section id="tripletas-tab" class="tab-content" style="display:none;">
            <h2 style="text-align:center; color: #fbbf24; margin-top: 20px;">💰 TRIPLETAS FIJAS DEL DÍA</h2>
            <div id="seccion-tripletas" class="tripleta-list"></div>
        </section>

        <section id="historial" class="tab-content" style="display:none;">
            <input type="date" id="fecha-busqueda-historial" class="fecha-input">
            <div class="tabla-contenedor">
                <table>
                    <thead><tr><th>HORA</th><th>NRO</th><th>ANIMAL</th><th>SEC</th><th>COLOR</th></tr></thead>
                    <tbody id="lista-historial"></tbody>
                </table>
            </div>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="logic.js"></script>
</body>
</html>
