<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LottoApp CRL V3 | Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="glass-container">
        <header>
            <h1 class="neon-text">LOTTOAPP CRL V3</h1>
            <div class="status-bar">
                <input type="date" id="fecha-analisis" onchange="cargarDatos()">
                <div id="live-clock">00:00:00</div>
            </div>
        </header>

        <div class="sector-grid" id="sector-display">
            </div>

        <div id="contenedor-supervision" class="supervision-container">
            </div>

        <div class="table-container">
            <div id="hora-seleccionada" class="selection-info">Seleccione una celda</div>
            <table>
                <thead><tr id="cabecera-dias"></tr></thead>
                <tbody id="cuerpo-tabla"></tbody>
            </table>
        </div>

        <div class="action-bar">
            <input type="number" id="num-rapido" placeholder="Nro" maxlength="2">
            <button onclick="registrarPorNumero()" class="btn-save-manual">GUARDAR RESULTADO</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
