<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LottoApp CRL V3 | Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="glass-container">
        <header>
            <h1 class="neon-text">LOTTOAPP CRL V3</h1>
            <div class="status-bar">
                <input type="date" id="date-picker" onchange="changeDate()">
                <div id="live-clock">00:00:00</div>
            </div>
        </header>

        <div class="sector-grid" id="sector-display"></div>

        <div id="contenedor-supervision" class="supervision-container"></div>

        <div class="table-container">
            <table>
                <thead><tr id="header-days"></tr></thead>
                <tbody id="main-table"></tbody>
            </table>
        </div>

        <div class="action-bar">
            <div id="save-status" class="status-msg">Semanario Activo</div>
            <button onclick="saveAllToSupabase()" class="btn-save-manual">💾 GUARDAR TODA LA SEMANA</button>
            <div style="display: flex; gap: 8px;">
                <button onclick="resetView()" class="btn-reset">🔄 LIMPIAR VISTA</button>
                <button onclick="searchByMonth()" class="btn-reset btn-blue">🔍 BUSCAR MES</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
